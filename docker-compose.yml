version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cosmetics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmetics_user
      POSTGRES_PASSWORD: cosmetics_password
      POSTGRES_DB: cosmetics_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetics_user -d cosmetics_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cosmetics_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmetics_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://cosmetics_user:cosmetics_password@db:5432/cosmetics_store
      - JWT_SECRET=atelier-luxury-cosmetic-jwt-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
